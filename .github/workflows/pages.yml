name: Deploy Atom Nursery (PWA) to GitHub Pages

# Publishes the static PWA in webapp/ to GitHub Pages on every push to main.
# Result URL: https://<your-user>.github.io/<repo>/  (custom domain added later via CNAME)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload webapp/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp
      - id: deployment
        uses: actions/deploy-pages@v4
