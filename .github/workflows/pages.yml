name: Deploy Atom Nursery (PWA) to GitHub Pages

# Publishes the static PWA in webapp/ to GitHub Pages on every push to main.
# Result URL: https://<your-user>.github.io/<repo>/  (custom domain added later via CNAME)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # webapp/ stays the readable source; what we publish is the same files with the JS and CSS
      # minified (app.js 141 -> 107 KB gzipped, styles.css 9.7 -> 5.9). No bundling or renaming, so
      # the ?v=NN query strings and the service worker keep working unchanged.
      - name: Minify webapp/ into dist_pages/
        run: |
          npm --prefix tools install --no-audit --no-fund
          node tools/build_web.js
      - name: Upload dist_pages/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist_pages
      - id: deployment
        uses: actions/deploy-pages@v4
