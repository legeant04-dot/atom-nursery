name: Build Android APK

# Deliberately manual. The Android shell wraps the LIVE website, so publishing the web app already
# reaches every phone — rebuilding the APK changes nothing for parents unless something inside
# android/ changed. Building it on every push would produce a stream of releases that all behave
# identically and would train everyone to ignore them.
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'What changed in the app shell (shown on the download page)'
        required: false
        default: 'อัปเดตแอป Atom Nursery สำหรับ Android'
      dry_run:
        description: 'Compile only — no signing key needed, nothing published. Use to check the project still builds.'
        type: boolean
        required: false
        default: false

permissions:
  contents: write        # needed to create the Release the APK is downloaded from

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # THE APK REPORTS THE WEB APP'S VERSION, not one of its own. APP_VERSION in webapp/app.js is
      # the only version number this project has; a second one in build.gradle would be a third
      # place to forget on release day.
      - name: Read APP_VERSION from the web app
        id: ver
        run: |
          # The SAME regex tools/release.js uses, so the two can never read the line differently.
          V=$(node -e "const m=/APP_VERSION\s*=\s*'Version\s+(\d+)\.(\d+)'/.exec(require('fs').readFileSync('webapp/app.js','utf8')); if(!m){process.exit(1)} console.log(m[2])")
          if [ -z "$V" ]; then echo "::error::APP_VERSION not found in webapp/app.js"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building shell for web app version 1.$V"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # A COMPILE-ONLY RUN, so the Gradle project can be proved before anyone creates a signing key.
      # It builds the DEBUG variant, which is never published — the release path still refuses to
      # produce an unsigned APK, because one that installs today and can never be updated is worse
      # than a failed build.
      - name: Dry run — compile only
        if: ${{ inputs.dry_run }}
        working-directory: android
        run: |
          gradle --no-daemon -PappVersion=${{ steps.ver.outputs.version }} assembleDebug
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/atom-nursery.apk"
          ls -l "$GITHUB_WORKSPACE/atom-nursery.apk"

      # The signing key exists ONLY as a secret. It is written to a path outside the workspace so it
      # cannot be picked up by anything that archives the build directory — this repository is
      # public and its artifacts are world-readable.
      - name: Restore the signing key
        if: ${{ !inputs.dry_run }}
        env:
          KS_B64: ${{ secrets.ATOM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::ATOM_KEYSTORE_BASE64 is not set. Run tools/android_keystore.sh once, on a machine you trust."
            exit 1
          fi
          mkdir -p "$HOME/.atomkeys"
          printf '%s' "$KS_B64" | base64 -d > "$HOME/.atomkeys/atom-release.p12"
          test -s "$HOME/.atomkeys/atom-release.p12"

      - name: Build the release APK
        if: ${{ !inputs.dry_run }}
        working-directory: android
        env:
          ATOM_KEYSTORE_PATH: ${{ github.workspace }}/../.atomkeys/atom-release.p12
          ATOM_KEYSTORE_PASSWORD: ${{ secrets.ATOM_KEYSTORE_PASSWORD }}
          ATOM_KEY_ALIAS: atom
        run: |
          # absolute path: build.gradle resolves storeFile relative to the app module otherwise
          export ATOM_KEYSTORE_PATH="$HOME/.atomkeys/atom-release.p12"
          gradle --no-daemon -PappVersion=${{ steps.ver.outputs.version }} assembleRelease

      # A release APK that is not signed installs on nobody's phone. Checking here turns that into a
      # failed build with a clear reason, instead of a download link that quietly does not work.
      - name: Verify it is signed
        if: ${{ !inputs.dry_run }}
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          cp "$APK" atom-nursery.apk
          ls -l atom-nursery.apk

      # The fingerprint the APK was actually signed with, next to the one the website publishes.
      # If these ever disagree the app still runs — it just shows an address bar, silently, and this
      # log is the only place that would have said why.
      - name: Compare with the fingerprint the website publishes
        if: ${{ !inputs.dry_run }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK_FP=$("$BT/apksigner" verify --print-certs atom-nursery.apk \
            | grep -i 'SHA-256 digest' | head -1 | sed 's/.*: *//' \
            | tr -d ' ' | tr 'a-f' 'A-F' | sed 's/../&:/g;s/:$//')
          SITE_FP=$(curl -fsSL https://legeant04-dot.github.io/.well-known/assetlinks.json 2>/dev/null \
            | tr -d ' "' | grep -oE '[0-9A-Fa-f:]{95}' | head -1 | tr 'a-f' 'A-F' || true)
          echo "APK  : $APK_FP"
          echo "site : ${SITE_FP:-<assetlinks.json not published>}"
          if [ -z "$SITE_FP" ]; then
            echo "::warning::assetlinks.json is not published — the app will work but will show an address bar."
          elif [ "$APK_FP" != "$SITE_FP" ]; then
            echo "::warning::Fingerprint mismatch — the app will show an address bar. Re-run tools/android_keystore.sh to republish assetlinks.json."
          else
            echo "Handshake matches: the app will open full screen."
          fi

      # ---------------------------------------------------------------------------------------
      # ACTUALLY START THE APP BEFORE ANYONE IS ASKED TO INSTALL IT.
      #
      # v286 shipped an APK that compiled, signed, verified, matched its fingerprint — and died the
      # instant it opened, every time, on every phone. The splash painted and the window folded away
      # (FileProvider path did not match where the TWA library writes the splash image). Every check
      # this workflow had was green, because none of them ran the thing.
      #
      # So it is run. If it cannot survive being opened, nothing is published, and the parents never
      # see it. Chrome is absent from the emulator image, so the TWA falls back to its own browser
      # path — that is fine: what is being tested here is that the app SURVIVES STARTING, which is
      # exactly what was broken.
      # ---------------------------------------------------------------------------------------
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test — install it and open it
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            set -e
            adb install -r atom-nursery.apk
            adb logcat -c
            adb shell am start -n th.ac.atomnursery.app/com.google.androidbrowserhelper.trusted.LauncherActivity
            sleep 12
            adb logcat -d > logcat.txt

            echo "----- crashes attributable to this app -----"
            if grep -qE "FATAL EXCEPTION" logcat.txt && grep -q "th.ac.atomnursery.app" logcat.txt; then
              echo "::error::The app crashed on launch."
              sed -n '/FATAL EXCEPTION/,/^$/p' logcat.txt | head -60
              exit 1
            fi
            # A crash can also land as "Force finishing activity" / process death without a FATAL line
            if grep -q "Force finishing activity th.ac.atomnursery.app" logcat.txt; then
              echo "::error::The launcher activity was force-finished — the app did not survive opening."
              grep -B 30 "Force finishing activity th.ac.atomnursery.app" logcat.txt | tail -40
              exit 1
            fi
            echo "----- is it still running? -----"
            PID=$(adb shell pidof th.ac.atomnursery.app || true)
            if [ -z "$PID" ]; then
              echo "::error::The app is not running 12s after launch — it opened and closed."
              grep -iE "atomnursery|AndroidRuntime|ActivityManager.*Died" logcat.txt | tail -40
              exit 1
            fi
            echo "✅ still alive (pid $PID) — the app opened and stayed open"

      # ONE STABLE LINK, FOREVER. Parents are given
      #   https://github.com/legeant04-dot/atom-nursery/releases/latest/download/atom-nursery.apk
      # which always redirects to the newest asset with this name, so the QR code and the download
      # page never have to be reprinted.
      - name: Publish the download
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the ENVIRONMENT, not spliced into the script with ${{ }}. This value is typed by
          # whoever starts the run, and a ${{ }} substitution is textual — a quote or a backtick in
          # the box would end up being executed as shell. It is also why the notes are built with
          # printf rather than a multi-line string: raw newlines at column 1 inside a `run: |` block
          # leave the block, which GitHub rejects while a plain YAML linter accepts it.
          NOTES_IN: ${{ inputs.release_notes }}
          VER: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          TAG="android-v1.$VER"
          APK_LINK="https://github.com/$REPO/releases/latest/download/atom-nursery.apk"
          printf '%s\n\n%s\n%s\n' "$NOTES_IN" \
            "ติดตั้ง: https://legeant04-dot.github.io/atom-nursery/ → 🤖 เครื่อง Android" \
            "ลิงก์ตรง: $APK_LINK" > release-notes.md
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" atom-nursery.apk \
            --title "Atom Nursery สำหรับ Android — v1.$VER" \
            --notes-file release-notes.md
          {
            echo "### 📱 APK published"
            echo "$APK_LINK"
          } >> "$GITHUB_STEP_SUMMARY"
