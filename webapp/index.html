<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <!-- no maximum-scale: pinch-zoom must stay available (WCAG 1.4.4) — older parents zoom to read amounts -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Atom Nursery</title>
  <meta name="theme-color" content="#1565C0" />
  <!-- Full mobile-app shell (installable PWA, standalone on iOS/Android) -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Atom Nursery" />
  <link rel="manifest" href="manifest.json" />
  <!-- opaque on purpose: iOS composites a TRANSPARENT apple-touch-icon onto BLACK -->
  <link rel="apple-touch-icon" href="assets/logo-maskable.png" />
  <!-- Only the two origins needed before first paint. PageSpeed warns above 4, and script.google.com
       isn't touched until after sign-in anyway. -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://static.line-scdn.net" crossorigin />
  <!-- Our own CSS is the only render-blocking stylesheet. The Google Fonts sheet used to block too
       (PageSpeed measured ~1.5s): load it as a non-blocking stylesheet instead. Sarabun still swaps
       in as soon as it arrives (display=swap); until then Thai renders in the system font. -->
  <!-- theme decided before the first paint: reading it later would flash white then go dark.
       No stored choice = follow the phone's own setting (@media prefers-color-scheme in styles.css). -->
  <script>try{var _t=localStorage.getItem('atom_theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
  <link rel="stylesheet" href="styles.css?v=168" />
  <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
        href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=optional" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=optional" /></noscript>
  <!-- the header logo is the LCP element on the sign-in screen — let the browser find it early -->
  <link rel="preload" as="image" href="assets/logo.png" fetchpriority="high" />
</head>
<body>
  <header class="topbar">
    <!-- these three are clickable divs, so they need the button role + a tab stop to be reachable
         from a keyboard; app.js maps Enter/Space onto a click for any [role=button] -->
    <div class="brand" style="cursor:pointer" onclick="HOME_TAP()" role="button" tabindex="0" aria-label="กลับหน้าหลัก / Home">
      <img src="assets/logo.png" alt="Atom Nursery" class="logo" width="42" height="42" fetchpriority="high" />
      <span class="brand-name">Atom Nursery</span>
    </div>
    <div class="user" id="userBox">
      <div class="topactions" id="topActions"></div>
      <button class="bell" id="searchBtn" hidden onclick="A_globalSearch()" aria-label="ค้นหา / Search"><svg class="i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13z"/><path d="M15.2 15.2 20 20"/></svg></button>
      <button class="langtoggle" id="langBtn" onclick="TOGGLE_LANG()" aria-label="เปลี่ยนภาษา / Switch language">TH</button>
      <button class="langtoggle" id="themeBtn" onclick="TOGGLE_THEME()" aria-label="สลับโหมดสว่าง / มืด · Light or dark mode"><svg class="i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></svg></button>
      <button class="bell" id="bellBtn" hidden onclick="BELL()" aria-label="การแจ้งเตือน / Notifications"><svg class="i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 15.5V11a6 6 0 1 0-12 0v4.5L4.5 18h15L18 15.5z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg><span class="badge" id="bellBadge" hidden></span></button>
      <div class="user-meta" style="cursor:pointer" onclick="NAME_TAP()" role="button" tabindex="0" aria-label="ข้อมูลของฉัน / My profile">
        <span class="user-name" id="userName">–</span>
        <span class="user-role" id="userRole"></span>
      </div>
      <div class="avatar" id="avatar" style="cursor:pointer" onclick="NAME_TAP()" role="button" tabindex="0" aria-label="ข้อมูลของฉัน / My profile">–</div>
      <button class="btn-ghost" id="logoutBtn" hidden>ออก</button>
    </div>
  </header>

  <main id="app">
    <!-- The sign-in screen, painted straight from HTML before any JavaScript runs.
         #app used to ship empty, so nothing could paint until app.js had executed AND liff.init()
         had finished a round-trip to LINE: PageSpeed measured FCP 2.0s against LCP 5.5s. A small
         splash brought LCP to 4.1s, but the largest element was still the sign-in card that only
         appeared after JS. This mirrors loginScreen() exactly — same markup, same Thai defaults —
         so the LCP element now exists at first paint. app.js replaces it (identically when signed
         out, with the home screen when signed in). Buttons need JS, which is fine: by the time
         anyone can tap, app.js has run. -->
    <div class="rolewrap" id="bootSplash">
      <img src="assets/logo.png" class="logo-lg" alt="Atom Nursery" width="132" height="112" fetchpriority="high" />
      <h2 class="page" style="text-align:center">เข้าสู่ระบบ</h2>
      <p class="muted">เข้าสู่ระบบด้วย LINE เท่านั้น · เชื่อมต่อกับ LINE OA ของโรงเรียน</p>
      <button class="role-card" onclick="window.LIFF_LOGIN&&LIFF_LOGIN()">
        <span class="ic" style="background:#06C755;color:#fff;font-weight:800">L</span>
        <span><b>เข้าสู่ระบบด้วย LINE</b><br><small>ใช้บัญชี LINE ที่เพิ่มเพื่อน OA ของโรงเรียน</small></span>
      </button>
      <label style="display:flex;align-items:center;gap:8px;justify-content:center;margin-top:10px;font-size:13px">
        <input type="checkbox" checked style="width:auto" /> จดจำการเข้าสู่ระบบ
      </label>
      <!-- this block must mirror installButtonsHTML() in app.js EXACTLY: loginScreen() ends with it,
           and any difference means JS changes the page height on replace — that is what took CLS from
           0.002 to 0.021 in v156. -->
      <div class="card instbox">
        <b>📲 เพิ่มแอปลงหน้าจอมือถือ</b>
        <small class="muted">จะมีไอคอน "Atom Nursery" อยู่ที่หน้าจอมือถือ กดเปิดได้ทันที ไม่ต้องเข้าผ่าน LINE ทุกครั้ง</small>
        <div class="row" style="gap:8px">
          <button class="btn outline" style="flex:1" onclick="window.DO_INSTALL&&DO_INSTALL('android')">🤖 เครื่อง Android</button>
          <button class="btn outline" style="flex:1" onclick="window.DO_INSTALL&&DO_INSTALL('ios')">🍎 iPhone / iPad</button>
        </div>
      </div>
    </div>
  </main>
  <nav class="bottomnav" id="bottomnav" hidden></nav>
  <div class="devbar" id="devbar"></div>

  <!-- defer on all of them: none touch the DOM while it parses, and defer keeps them running in this
       exact order, so nothing blocks the first paint any more. The LINE SDK is NOT here: app.js
       fetches it after the first paint (loadLiff), keeping 32 KB of third-party JS — plus its own
       manifest and message-bundle requests — out of the critical path.
       engine.js, mockdata.js and xlsx_min.js are deliberately absent: gas mode runs the engine
       server-side (src/Engine.gs), the sample rows are mock-mode only, and the spreadsheet writer is
       needed by two admin screens. api.js fetches each on demand (mockconfig.js keeps the seed
       CONFIG that ~30 fallbacks read). -->
  <script defer src="mockconfig.js?v=168"></script>
  <script defer src="growth_standard.js?v=168"></script>
  <script defer src="i18n.js?v=168"></script>
  <script defer src="i18n_tr.js?v=168"></script>
  <script defer src="api.js?v=168"></script>
  <script defer src="app.js?v=168"></script>
  <script>
    // Register SW but always pull fresh code: check for updates and auto-reload
    // once a new service worker takes control (prevents stale-cache showing old UI).
    if ('serviceWorker' in navigator) {
      let _reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (_reloaded) return; _reloaded = true; location.reload();
      });
      navigator.serviceWorker.register('sw.js').then(reg => {
        reg.update();
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          if (nw) nw.addEventListener('statechange', () => { if (nw.state === 'activated') { /* controllerchange will reload */ } });
        });
      }).catch(()=>{});
      // periodic update check while open
      setInterval(() => navigator.serviceWorker.getRegistration().then(r => r && r.update()), 30000);
    }
  </script>
</body>
</html>
