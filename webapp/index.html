<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <!-- no maximum-scale: pinch-zoom must stay available (WCAG 1.4.4) — older parents zoom to read amounts -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Atom Nursery</title>
  <meta name="theme-color" content="#1565C0" />
  <!-- Full mobile-app shell (installable PWA, standalone on iOS/Android) -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Atom Nursery" />
  <link rel="manifest" href="manifest.json" />
  <!-- opaque on purpose: iOS composites a TRANSPARENT apple-touch-icon onto BLACK -->
  <link rel="apple-touch-icon" href="assets/logo-maskable.png" />
  <!-- warm up the TLS handshake to the three third parties every session needs: fonts, the LIFF SDK, and the GAS API -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://static.line-scdn.net" crossorigin />
  <link rel="preconnect" href="https://script.google.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=127" />
</head>
<body>
  <header class="topbar">
    <div class="brand" title="Home" style="cursor:pointer" onclick="HOME_TAP()">
      <img src="assets/logo.png" alt="Atom Nursery" class="logo" />
      <span class="brand-name">Atom Nursery</span>
    </div>
    <div class="user" id="userBox">
      <div class="topactions" id="topActions"></div>
      <button class="langtoggle" id="langBtn" onclick="TOGGLE_LANG()">TH</button>
      <button class="bell" id="bellBtn" hidden onclick="BELL()">🔔<span class="badge" id="bellBadge" hidden></span></button>
      <div class="user-meta" style="cursor:pointer" onclick="NAME_TAP()">
        <span class="user-name" id="userName">–</span>
        <span class="user-role" id="userRole"></span>
      </div>
      <div class="avatar" id="avatar" title="Profile" style="cursor:pointer" onclick="NAME_TAP()">–</div>
      <button class="btn-ghost" id="logoutBtn" hidden>ออก</button>
    </div>
  </header>

  <main id="app"></main>
  <nav class="bottomnav" id="bottomnav" hidden></nav>
  <div class="devbar" id="devbar"></div>

  <!-- defer on all of them: none touch the DOM while it parses, and defer keeps them running in this
       exact order (liff → mock → api → app), so nothing blocks the first paint any more.
       engine.js is deliberately absent: gas mode runs it server-side (src/Engine.gs), and api.js
       pulls it in on demand if anyone ever flips CONFIG.MODE back to 'mock'. -->
  <script defer src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script defer src="mockdata.js?v=127"></script>
  <script defer src="growth_standard.js?v=127"></script>
  <script defer src="xlsx_min.js?v=127"></script>
  <script defer src="i18n.js?v=127"></script>
  <script defer src="i18n_tr.js?v=127"></script>
  <script defer src="api.js?v=127"></script>
  <script defer src="app.js?v=127"></script>
  <script>
    // Register SW but always pull fresh code: check for updates and auto-reload
    // once a new service worker takes control (prevents stale-cache showing old UI).
    if ('serviceWorker' in navigator) {
      let _reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (_reloaded) return; _reloaded = true; location.reload();
      });
      navigator.serviceWorker.register('sw.js').then(reg => {
        reg.update();
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          if (nw) nw.addEventListener('statechange', () => { if (nw.state === 'activated') { /* controllerchange will reload */ } });
        });
      }).catch(()=>{});
      // periodic update check while open
      setInterval(() => navigator.serviceWorker.getRegistration().then(r => r && r.update()), 30000);
    }
  </script>
</body>
</html>
