server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  location = /sw.js { add_header Cache-Control "no-cache" always; add_header X-Robots-Tag "noindex, nofollow" always; }
  location = /index.html { add_header Cache-Control "no-cache" always; add_header X-Robots-Tag "noindex, nofollow" always; }
  location / { try_files $uri $uri/ /index.html; }
}
